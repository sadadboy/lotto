<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto Bot 로그인</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px 28px;
        }

        h1 { font-size: 1.4rem; margin-bottom: 6px; }
        p.sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; line-height: 1.5; }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
        }

        input:focus { outline: 2px solid var(--accent); border-color: transparent; }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .error { color: var(--danger); font-size: 0.9rem; margin-top: 12px; }
        code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>

<body>
    <div class="card">
        <h1>🎱 Lotto Bot</h1>
        {% if not_configured %}
        <p class="sub">대시보드 비밀번호가 아직 설정되지 않았습니다. 서버에서 아래 명령으로 설정하세요.</p>
        <p><code>docker compose exec lotto-bot python dashboard/access.py set-password</code></p>
        {% else %}
        <p class="sub">비밀번호를 입력하세요. 이 기기는 다음부터 자동으로 들어옵니다.</p>
        <form method="post">
            <input type="password" name="password" placeholder="비밀번호" autofocus required autocomplete="current-password">
            <button type="submit">들어가기</button>
        </form>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        {% endif %}
    </div>
</body>

</html>
